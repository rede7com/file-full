name: "File Manager HD PHP"
version: "2026-1.7.0"
slug: file_full
description: "Gerenciador de arquivos PHP, com acesso ao /config e HDs Externos"
url: "https://rede7.com.br"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
startup: services
boot: auto
init: false

# Necessário para enxergar /dev e montar o disco dentro do container.
# full_access dá acesso aos dispositivos; SYS_ADMIN é a capability que o
# próprio syscall mount() exige (sem ela dá "permission denied" mesmo com full_access).
full_access: true
privileged:
  - SYS_ADMIN
  - NET_ADMIN
apparmor: false

# Permite chamar a API do Home Assistant Core (via proxy do Supervisor, em
# http://supervisor/core/api/) usando o token SUPERVISOR_TOKEN que já vem
# injetado automaticamente — usado pra criar notificações (disco cheio,
# problema de SMART, etc).
homeassistant_api: true

# Permite chamar a API do próprio Supervisor (http://supervisor/) — usado
# pra ler/gravar as opções deste add-on (aba Configurações dentro do próprio
# app) e pra reiniciar o add-on depois de salvar. hassio_role: default é
# suficiente pro add-on mexer só nas próprias opções/reinício; não dá acesso
# a outros add-ons.
hassio_api: true
hassio_role: default

# Expõe a UI dentro do próprio Home Assistant, com autenticação
# via sessão do usuário logado (não precisa expor porta nem Basic Auth).
ingress: true
ingress_port: 8099
panel_icon: mdi:folder-multiple
panel_title: File Manager HD PHP

# Publica a mesma porta usada pelo ingress diretamente no host, pra dar pra
# abrir o app numa aba separada do navegador (fora do painel do HA) — usa o
# login próprio do app (independente da sessão do HA).
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Acesso direto ao app, fora do painel do Home Assistant"

# Disponibiliza a pasta de configuração do HA dentro do container em /config.
# Não fica visível no gerenciador de arquivos por padrão — só se a flag
# expose_ha_config estiver ligada (ver options abaixo). addon_config removido
# de propósito: a documentação do HA não permite ele e "config" juntos no
# mesmo map (addon_config é uma pasta privada só deste add-on, diferente do
# /config real do HA que já usamos).
#
# all_addon_configs:rw dá acesso de leitura/escrita a /addon_configs de
# TODOS os add-ons (usado pela opção expose_addon_configs, pra navegar/editar
# config de outros add-ons pelo gerenciador). NÃO é onde este add-on guarda
# os próprios dados — /addon_configs não entra automaticamente no backup do
# HA (testado na prática) e se perde numa recuperação. Dados próprios
# (usuários, senha, código instalado) ficam em /data, que é automático pra
# todo add-on e entra no backup quando o add-on é selecionado.
map:
  - config:rw
  - homeassistant_config:rw
  - ssl:rw
  - all_addon_configs:rw
  - addons:rw
  - share:rw
  - backup:rw
  - media:rw

# Necessário pro Avahi anunciar o compartilhamento na rede local via mDNS —
# multicast não atravessa a rede isolada padrão do Docker, só funciona com a
# própria stack de rede do host. Efeito colateral: a porta 445 (SMB) passa a
# escutar direto na rede do host (mesmo mecanismo que o add-on Samba oficial
# usa) — não tem outro jeito de fazer o Mac descobrir o Time Machine sozinho.
# Mesma porta 445 é reaproveitada pelo SMB de uso geral (smb_enabled).
host_network: true

options:
  # Cada item aceita dois formatos:
  #   "NOME"                              -> identifica o disco pelo label (como sempre)
  #   "uuid:XXXX-YYYY"                     -> identifica pelo UUID (útil se dois discos
  #                                           tiverem o mesmo label — UUID nunca colide;
  #                                           veja o UUID com `blkid` via SSH no host)
  #   "uuid:XXXX-YYYY:Nome Amigável"       -> por UUID, mas com nome de pasta customizado
  disk_labels: []
  fs_type: "auto"
  expose_ha_config: false
  expose_addons: false
  expose_backup: false
  expose_addon_configs: false
  # Time Machine: desligado por padrão. time_machine_disk aceita o mesmo
  # formato de disk_labels ("NOME" ou "uuid:XXXX-YYYY[:nome]") — NÃO precisa
  # também estar em disk_labels, o Time Machine monta esse disco sozinho. O
  # disco INTEIRO fica dedicado só ao Time Machine (não é uma subpasta dentro
  # de um disco de uso geral, pra não misturar backup com arquivos comuns).
  # Usuário/senha aqui são exclusivos do SMB, diferentes do login web.
  time_machine_enabled: false
  time_machine_disk: ""
  time_machine_username: "timemachine"
  time_machine_password: ""
  time_machine_max_size_gb: 0
  # SMB de uso geral: desligado por padrão. Compartilha os mesmos discos
  # visíveis no gerenciador (disk_labels, via /mnt/file_full) — diferente do
  # Time Machine, que é um disco inteiro dedicado só a isso. Usuário/senha
  # aqui são exclusivos do SMB, diferentes do login web e do Time Machine.
  smb_enabled: false
  # Nome que a máquina mostra na rede: no Windows/"Rede", no Finder do Mac e
  # no anúncio Bonjour (<nome>.local). Sem isso, cai no hostname feio que o
  # Supervisor gera pro container (ex: "08a40d41-file-full"). Aceita espaços
  # (viram "server string" livre); pro NetBIOS e pro nome .local o add-on
  # sanitiza sozinho (só letras/números/hífen, NetBIOS cortado em 15 chars).
  smb_server_name: "file-full"
  smb_username: "arquivos"
  smb_password: ""
  # WireGuard: cliente conecta em wg_endpoint_host:wg_port e só enxerga este
  # host (AllowedIPs restrito ao túnel) — navegação normal do dispositivo
  # cliente não passa pela VPN. wg_allowed_ports filtra, via iptables, quais
  # portas do host o túnel pode alcançar.
  # Cliente WireGuard: cola aqui os dados do .conf que o servidor VPN te deu
  # (ex: root@vpn2). wg_allowed_ips por padrão NÃO usa 0.0.0.0/0 (isso
  # tunelaria toda a navegação do HA) — deixe em branco que o addon calcula
  # a sub-rede /24 a partir de wg_address automaticamente.
  wg_enabled: false
  wg_private_key: ""
  wg_address: ""
  wg_dns: ""
  wg_peer_public_key: ""
  wg_preshared_key: ""
  wg_endpoint: ""
  wg_allowed_ips: ""
  wg_persistent_keepalive: 25
  # Segundo cliente WireGuard, independente do primeiro (outro servidor VPN,
  # outra sub-rede). Mesmas regras do primeiro: wg2_allowed_ips em branco ->
  # calculado como o /24 de wg2_address; nunca 0.0.0.0/0. Sobe como interface
  # wg1 (o primeiro cliente continua sendo wg0, sem nenhuma mudança nele).
  wg2_enabled: false
  wg2_private_key: ""
  wg2_address: ""
  wg2_dns: ""
  wg2_peer_public_key: ""
  wg2_preshared_key: ""
  wg2_endpoint: ""
  wg2_allowed_ips: ""
  wg2_persistent_keepalive: 25
  # SSH real dentro do container: root, somente chave pública (nunca senha).
  # Dá acesso de shell a tudo que o add-on já enxerga — os HDs externos
  # (/mnt/file_full), /config (HA de verdade), /share, /backup,
  # /addon_configs — inclusive pra configurar o HA direto por linha de
  # comando. Sem ssh_authorized_key preenchido, o sshd nem sobe (ver
  # 05-setup-ssh.sh). host_network:true já expõe a porta direto no host, sem
  # precisar de entrada em "ports".
  ssh_enabled: false
  ssh_port: 2222
  ssh_authorized_key: ""

schema:
  disk_labels:
    - str
  fs_type: "list(auto|ext4|ntfs-3g|exfat)"
  expose_ha_config: bool
  expose_addons: bool
  expose_backup: bool
  expose_addon_configs: bool
  time_machine_enabled: bool
  time_machine_disk: "str"
  time_machine_username: "str"
  time_machine_password: "password"
  time_machine_max_size_gb: "int(0,100000)"
  smb_enabled: bool
  smb_server_name: "str?"
  smb_username: "str"
  smb_password: "password"
  wg_enabled: bool
  wg_private_key: "password"
  wg_address: "str"
  wg_dns: "str"
  wg_peer_public_key: "str"
  wg_preshared_key: "password"
  wg_endpoint: "str"
  wg_allowed_ips: "str"
  wg_persistent_keepalive: "int(0,120)"
  wg2_enabled: bool
  wg2_private_key: "password"
  wg2_address: "str"
  wg2_dns: "str"
  wg2_peer_public_key: "str"
  wg2_preshared_key: "password"
  wg2_endpoint: "str"
  wg2_allowed_ips: "str"
  wg2_persistent_keepalive: "int(0,120)"
  ssh_enabled: bool
  ssh_port: "int(1024,65535)"
  ssh_authorized_key: "str"
